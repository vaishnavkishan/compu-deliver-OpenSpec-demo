apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: {{ .Values.api.image }}
          imagePullPolicy: {{ .Values.api.pullPolicy }}
          env:
            - {name: DB_URL, value: "jdbc:postgresql://postgres:5432/{{ .Values.postgres.db }}"}
            - {name: DB_USER, value: {{ .Values.postgres.user | quote }}}
            - {name: DB_PASSWORD, value: {{ .Values.postgres.password | quote }}}
            - {name: RABBIT_HOST, value: rabbitmq}
            - {name: RABBIT_PORT, value: "5672"}
            - {name: RABBIT_USER, value: {{ .Values.rabbitmq.user | quote }}}
            - {name: RABBIT_PASSWORD, value: {{ .Values.rabbitmq.password | quote }}}
          ports:
            - containerPort: 8081
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8081}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8081}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8081}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports:
    - port: 8081
