apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
spec:
  replicas: 1
  selector:
    matchLabels: {app: portal}
  template:
    metadata:
      labels: {app: portal}
    spec:
      containers:
        - name: portal
          image: {{ .Values.portal.image }}
          imagePullPolicy: {{ .Values.portal.pullPolicy }}
          env:
            - {name: API_URL, value: "http://api:8081"}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: {path: /, port: 80}
---
apiVersion: v1
kind: Service
metadata:
  name: portal
spec:
  type: NodePort
  selector: {app: portal}
  ports:
    - {port: 80, nodePort: {{ .Values.portal.nodePort }}}
